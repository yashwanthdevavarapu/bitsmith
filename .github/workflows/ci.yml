name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests examples scripts
      - name: Ruff format
        run: ruff format --check src tests examples scripts
      - name: Mypy
        run: mypy
      - name: No em or en dashes in tracked text
        run: |
          if git grep -nP '\x{2014}|\x{2013}' -- ':!*.png'; then
            echo "Found em or en dashes"
            exit 1
          fi

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        shell: bash
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Full suite with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: pytest -q --cov --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  smoke:
    name: Wheel, CLI and examples
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and install the wheel
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install build
          python -m build
          pip install dist/*.whl
      - name: Run CLI
        run: |
          bitsmith --version
          bitsmith info
          bitsmith pack --format int4
          bitsmith pack --format sparse24
          bitsmith sqnr --shape 256x256 --outliers 4
          bitsmith roofline --params 7e9 --hardware a100-40g
      - name: Run examples
        run: |
          python examples/01_quickstart.py
          python examples/02_calibration.py
          python examples/03_roofline.py
