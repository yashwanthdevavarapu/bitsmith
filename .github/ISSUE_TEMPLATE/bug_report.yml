name: Bug report
description: Something gives a wrong result, crashes, or does not match the docs
labels: ["bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search
        [existing issues](https://github.com/yashwanthdevavarapu/bitsmith/issues) first.
        For security problems, follow SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The full error message or the wrong output.
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest command or Python snippet that shows the problem.
      placeholder: |
        bitsmith sqnr --shape 64x100
        # or
        from bitsmith import QLinear
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `bitsmith info`, plus OS, Python version, and GPU if relevant.
      render: text
    validations:
      required: true
