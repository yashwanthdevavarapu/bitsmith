[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bitsmith"
version = "0.2.0"
description = "LLM weight quantization from first principles: INT8/INT4/FP8/ternary, bit packing, 2:4 sparsity, SmoothQuant, AWQ, GPTQ and a Pareto benchmark in pure PyTorch."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["quantization", "llm", "pytorch", "gptq", "awq", "smoothquant", "fp8", "sparsity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
hf = ["transformers>=4.45", "datasets>=2.20", "accelerate>=0.30"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
bitsmith = "bitsmith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bitsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: trains a model or runs a full sweep (deselect with -m 'not slow')",
    "hf: needs network access and the hf extra",
]

[tool.coverage.run]
source = ["bitsmith"]
omit = ["src/bitsmith/__main__.py", "src/bitsmith/bench/hf.py", "src/bitsmith/kernels/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["N812", "RUF001", "RUF002", "RUF003", "PT018", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]
"examples/**" = ["T201"]
"src/bitsmith/kernels/**" = ["N803", "N806"]

[tool.mypy]
python_version = "3.10"
packages = ["bitsmith"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Triton kernels use the Triton DSL, whose arguments are untyped by design.
module = "bitsmith.kernels.int4_triton"
disallow_untyped_defs = false
